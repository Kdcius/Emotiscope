; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = https://github.com/platformio/platform-espressif32.git#develop
platform_packages = 
	platformio/framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32.git#3.0.0-rc1
	platformio/framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-libs.git#idf-release/v5.1
board = seeed_xiao_esp32s3
framework = arduino
; Pinned: PsychicHttp 3.x renamed the server/request API (listen(), reply(),
; PsychicFileResponse ctor), which this firmware predates. d484548 == v1.2.1.
lib_deps =
	https://github.com/hoeken/PsychicHttp#d484548f847edca9fe29dd0b00ad22551ad26caa
upload_speed = 460800
;upload_port = COM10
; XIAO enumerates as native USB CDC (ARDUINO_USB_CDC_ON_BOOT=1), so this baud is
; ignored by the port - it only needs to match init_serial() if you wire up UART0.
monitor_speed = 115200
;monitor_port = COM10
monitor_filters = 
	;debug
	send_on_enter
	;esp32_exception_decoder

debug_tool = esp-builtin
debug_init_break = tbreak init_system
build_type = release
;board_build.arduino.upstream_packages = no
board_build.filesystem = littlefs
board_build.partitions = default_8MB.csv
build_flags = 
	-O3
	-Wall
	-Wextra
check_skip_packages = true